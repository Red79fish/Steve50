<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <script>
    /* ################################################################
       ###                                                          ###
       ###            ★  REGLAGES DE LA SEMAINE  ★                  ###
       ###                                                          ###
       ################################################################ */

    // 1) SELECTION : les numeros a afficher, dans l'ordre voulu.
    //    Chaque numero entre guillemets, separes par des virgules.
    //    Pour TOUT afficher, laisse vide : const SELECTION = [];
    const SELECTION = [27,14,22];

    // 2) NOMBRE MAXIMUM de paires cover/audio
    //    (utilise seulement quand SELECTION est vide).
    const NOMBRE_AUDIOS = 60;

    // 3) AUTO-PLAY : enchaine les audios automatiquement
    //    true  = actif  (le suivant demarre seul, arret apres le dernier)
    //    false = desactif (un audio a la fois)
    const AUTO_PLAY = true;

    // 4) PAUSE entre deux audios en AUTO-PLAY, en secondes
    //    Exemples : 0 = aucune pause, 2 = deux secondes, 1.5 = une seconde et demie
    const PAUSE_ENTRE_AUDIOS = 2;

    // 5) RANDOM ORDER : ordre de lecture au hasard en AUTO-PLAY
    //    Une bande "RANDOM ORDER" sous l'image-titre permet au visiteur
    //    de l'activer (orange) ou le desactiver (gris).
    //    true  = active au chargement de la page (bande orange)
    //    false = desactive au chargement de la page (bande grise)
    //    Le suivant est choisi au hasard parmi ceux pas encore joues
    //    (arret quand tous ont joue une fois).
    //    N'a d'effet que si AUTO_PLAY = true (sinon la bande est cachee).
    const RANDOM_ORDER = true;

    /* ################################################################ */
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steve50</title>

  <style>
    :root {
      --fond: #111;
      --orange: #ff5a1f;      /* couleur de la cover en cours */
      --texte: #eee;
      --texte-doux: #999;
      --barre-vide: #333;
    }

    body {
      margin: 0;
      background: var(--fond);
      color: var(--texte);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      padding: 20px 0;
    }

    /* ---------- Un audio ---------- */
    .image-titre {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: 28px;
    }

    .piste {
      margin-bottom: 28px;
    }

    .cover {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      outline: 3px solid transparent;
      outline-offset: -3px;
      transition: outline-color 0.2s;
    }

    .cover img {
      width: 100%;
      height: auto;
      display: block;
    }

    .cover:focus-visible {
      outline-color: #fff;
    }

    /* Cover en cours : contour orange */
    .piste.active .cover {
      outline: 6px solid var(--orange);
      outline-offset: -6px;
    }

    /* Icone lecture / pause au centre */
    .icone {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 84px;
      height: 84px;
      margin: -42px 0 0 -42px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .cover:hover .icone,
    .cover:focus-visible .icone,
    .piste.active .icone {
      opacity: 1;
    }

    .piste.active .icone {
      background: var(--orange);
    }

    /* ---------- Barre de progression ---------- */
    .lecteur {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 4px 0;
    }

    .titre {
      padding: 8px 4px 0;
      font-size: 15px;
    }

    .temps {
      font-size: 13px;
      color: var(--texte-doux);
      font-variant-numeric: tabular-nums;
      min-width: 92px;
      text-align: right;
    }

    .progression {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 3px;
      background: var(--barre-vide);
      cursor: pointer;
      margin: 0;
    }

    .progression:disabled {
      cursor: default;
      opacity: 0.4;
    }

    .progression::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--orange);
      border: 0;
    }

    .progression::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--orange);
      border: 0;
    }

    .progression:disabled::-webkit-slider-thumb { background: #666; }
    .progression:disabled::-moz-range-thumb { background: #666; }

    .erreur {
      color: var(--orange);
      font-size: 13px;
      padding: 8px 4px 0;
    }

    /* ---------- Bande RANDOM ORDER ---------- */
    .bande-random {
      display: block;
      width: 100%;
      margin: 0 0 28px;
      padding: 8px 0;
      border: 0;
      background: #808080;          /* gris 50 % = desactive */
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .bande-random[aria-pressed="true"] {
      background: var(--orange);    /* orange = active */
    }

    .bande-random:focus-visible {
      outline: 3px solid #fff;
      outline-offset: -3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .cover, .icone, .bande-random { transition: none; }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Image titre : non reliee a un audio -->
    <img class="image-titre" src="image-titre/image-titre-2.jpg" alt=""
         onerror="this.remove()">

    <!-- Bande RANDOM ORDER : cliquer pour activer / desactiver -->
    <button class="bande-random" id="bande-random" type="button"
            aria-pressed="false">RANDOM ORDER</button>

    <div id="liste"></div>
  </div>

  <script>
    /* ============================================================
       REGLAGES - c'est ici que tu modifies
       ============================================================ */

    // Dossiers et noms des fichiers
    const DOSSIER_COVERS = "covers/";
    const DOSSIER_AUDIO  = "audios/";
    // cover-001.jpg  <->  audio-001.mp3

    // Titres optionnels, dans l'ordre (1re ligne = audio-001).
    // Laisse vide ("") pour ne rien afficher sous une cover.
    const TITRES = [
      // "Titre de l'audio 1",
      // "Titre de l'audio 2",
    ];

    /* ============================================================
       NE PAS MODIFIER EN DESSOUS (sauf si tu sais ce que tu fais)
       ============================================================ */

    const liste = document.getElementById("liste");
    const audio = new Audio();      // un seul lecteur pour toute la page
    audio.preload = "none";
    let audioActif = null;       // la carte en cours

    let minuteurSuivant = null;  // la pause en cours entre deux audios
    const dejaJoues = new Set(); // pour RANDOM_ORDER : audios deja joues

    // Bande RANDOM ORDER (depart = reglage du haut)
    let randomOrderActif = RANDOM_ORDER;
    const bandeRandom = document.getElementById("bande-random");
    if (!AUTO_PLAY) bandeRandom.remove();   // inutile sans AUTO-PLAY
    bandeRandom.setAttribute("aria-pressed", String(randomOrderActif));
    bandeRandom.addEventListener("click", () => {
      randomOrderActif = !randomOrderActif;
      bandeRandom.setAttribute("aria-pressed", String(randomOrderActif));
      dejaJoues.clear();                    // nouveau tirage
      if (audioActif) dejaJoues.add(audioActif);
    });

    const ICONE_PLAY  = "\u25B6";        // triangle lecture
    const ICONE_PAUSE = "\u275A\u275A";  // deux barres pause

    // Trouve la cover suivante visible sur la page (ou null si c'est la derniere)
    function carteSuivante(carte) {
      // RANDOM ORDER : au hasard parmi les covers visibles pas encore jouees
      if (randomOrderActif) {
        const restantes = [...liste.querySelectorAll(".piste")]
          .filter(c => !c.hidden && !dejaJoues.has(c));
        if (!restantes.length) { dejaJoues.clear(); return null; }  // tout joue : arret
        return restantes[Math.floor(Math.random() * restantes.length)];
      }
      // Sinon : la suivante dans l'ordre de la page
      let suivante = carte.nextElementSibling;
      while (suivante && suivante.hidden) suivante = suivante.nextElementSibling;
      return suivante;
    }

    // Passe a la cover suivante et la fait defiler a l'ecran
    function jouerSuivante(carte) {
      const suivante = carteSuivante(carte);
      if (!suivante) return;                 // derniere : on s'arrete
      cliquerCover(suivante);
      const reduit = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      suivante.scrollIntoView({ behavior: reduit ? "auto" : "smooth", block: "center" });
    }

    function numero(n) {
      return String(n).padStart(3, "0");  // 7 -> "007"
    }

    function formatTemps(s) {
      if (!isFinite(s)) return "0:00";
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ":" + String(sec).padStart(2, "0");
    }

    // Liste des numeros a afficher : la selection, ou tout si elle est vide
    const numerosAffiches = SELECTION.length
      ? SELECTION.map(n => parseInt(n, 10)).filter(n => n > 0)
      : Array.from({ length: NOMBRE_AUDIOS }, (_, k) => k + 1);

    // Fabrique les cartes automatiquement
    for (const i of numerosAffiches) {
      const num = numero(i);
      const titre = TITRES[i - 1] || "";

      const carte = document.createElement("div");
      carte.className = "piste";
      carte.dataset.audio = DOSSIER_AUDIO + "audio-" + num + ".mp3";

      carte.innerHTML = `
        <button class="cover" type="button" aria-label="Lire ${titre || "l'audio " + num}">
          <img src="${DOSSIER_COVERS}cover-${num}.jpg" alt="">
          <span class="icone" aria-hidden="true">${ICONE_PLAY}</span>
        </button>
        ${titre ? `<div class="titre">${titre}</div>` : ""}
        <div class="lecteur">
          <input class="progression" type="range" min="0" max="100" step="0.1" value="0"
                 disabled aria-label="Position dans l'audio">
          <span class="temps">0:00 / 0:00</span>
        </div>
      `;

      carte.querySelector(".cover").addEventListener("click", () => cliquerCover(carte));

      // Avancer dans l'audio en glissant la barre
      carte.querySelector(".progression").addEventListener("input", (e) => {
        if (carte === audioActif && isFinite(audio.duration)) {
          audio.currentTime = (e.target.value / 100) * audio.duration;
        }
      });

      // Cachee tant qu'on ne sait pas si l'image existe
      carte.hidden = true;
      liste.appendChild(carte);

      // Test : l'image existe ? -> on montre la carte. Sinon -> on la retire.
      const test = new Image();
      test.onload  = () => { carte.hidden = false; };
      test.onerror = () => { carte.remove(); };
      test.src = DOSSIER_COVERS + "cover-" + num + ".jpg";
    }

    function cliquerCover(carte) {
      // Un clic annule la pause en attente avant l'audio suivant
      clearTimeout(minuteurSuivant);
      minuteurSuivant = null;

      // Meme cover : pause / reprise
      if (carte === audioActif) {
        if (audio.paused) audio.play();
        else audio.pause();
        return;
      }

      // Autre cover : on arrete le precedent et on remet sa barre a zero
      if (audioActif) {
        audio.pause();
        reinitialiser(audioActif);
      }

      audioActif = carte;
      dejaJoues.add(carte);
      carte.classList.add("active");
      carte.querySelector(".progression").disabled = false;
      const ancienneErreur = carte.querySelector(".erreur");
      if (ancienneErreur) ancienneErreur.remove();

      audio.src = carte.dataset.audio;
      audio.play().catch(() => {});
    }

    function reinitialiser(carte) {
      carte.classList.remove("active");
      carte.querySelector(".icone").textContent = ICONE_PLAY;
      const barre = carte.querySelector(".progression");
      barre.value = 0;
      barre.disabled = true;
      carte.querySelector(".temps").textContent = "0:00 / 0:00";
    }

    // Icone lecture / pause selon l'etat
    audio.addEventListener("play", () => {
      if (audioActif) audioActif.querySelector(".icone").textContent = ICONE_PAUSE;
    });
    audio.addEventListener("pause", () => {
      if (audioActif) audioActif.querySelector(".icone").textContent = ICONE_PLAY;
    });

    // Mise a jour de la barre et du temps
    audio.addEventListener("timeupdate", () => {
      if (!audioActif || !isFinite(audio.duration)) return;
      audioActif.querySelector(".progression").value =
        (audio.currentTime / audio.duration) * 100;
      audioActif.querySelector(".temps").textContent =
        formatTemps(audio.currentTime) + " / " + formatTemps(audio.duration);
    });

    // Fin de l'audio : on remet la cover a zero, puis AUTO-PLAY si active
    audio.addEventListener("ended", () => {
      const terminee = audioActif;
      if (terminee) reinitialiser(terminee);
      audioActif = null;
      if (AUTO_PLAY && terminee) {
        minuteurSuivant = setTimeout(() => {
          minuteurSuivant = null;
          jouerSuivante(terminee);
        }, Math.max(0, PAUSE_ENTRE_AUDIOS) * 1000);
      }
    });

    // Fichier mp3 introuvable
    audio.addEventListener("error", () => {
      if (!audioActif || !audio.src) return;
      const carte = audioActif;
      reinitialiser(carte);
      audioActif = null;
      const msg = document.createElement("div");
      msg.className = "erreur";
      msg.textContent = "Fichier introuvable : " + carte.dataset.audio;
      carte.appendChild(msg);
      if (AUTO_PLAY) jouerSuivante(carte);   // on saute l'audio manquant
    });
  </script>
</body>
</html>
